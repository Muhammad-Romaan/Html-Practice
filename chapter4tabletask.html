<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        margin-top: 50px;
    }

    h1 {
        text-align: center;
        color: #28a745;
        margin-bottom: 10%;
    }

    table {
        border-collapse: collapse;
        width: 80%;
        background-color: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    thead {
        background-color: #28a745;
        color: white;
    }

    th,
    td {
        padding: 15px;
        text-align: center;
    }

    tbody tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tbody tr:hover {
        background-color: #d4edda;
        cursor: pointer;
    }

    th {
        font-size: 18px;
    }

    td {
        font-size: 16px;
    }
</style>

<body>

    <h1>Cricket Match Scorecard</h1>
    <table border="1" cellspacing="0" cellpadding="20">
        <thead>
            <tr>
                <th>Player Name</th>
                <th>Runs</th>
                <th>Balls</th>
                <th>Fours</th>
                <th>Sixes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Babar Azam</td>
                <td>78</td>
                <td>56</td>
                <td>8</td>
                <td>2</td>
            </tr>
            <tr>
                <td>Mohammad Rizwan</td>
                <td>65</td>
                <td>48</td>
                <td>6</td>
                <td>1</td>
            </tr>
            <tr>
                <td>Fakhar Zaman</td>
                <td>42</td>
                <td>25</td>
                <td>4</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Iftikhar Ahmed</td>
                <td>30</td>
                <td>18</td>
                <td>2</td>
                <td>2</td>
            </tr>
            <tr>
                <td>Shadab Khan</td>
                <td>15</td>
                <td>10</td>
                <td>1</td>
                <td>1</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
